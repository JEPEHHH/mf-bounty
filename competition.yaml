# bounty-entrants-02, "Get the most paying entrants across the bounties you launch on make.fun": the test version of
# bounty-entrants-01, the same contest with only its reward, its paid places and its timing changed. An entrant (and its
# agent) launches one or several bounties of its own on make.fun, each charging an entry fee of at least $0.50, proposed
# through make.fun's sponsor flow and opened inside this contest's window, and brings people in to enter them and pay
# their fees; the entry's repository names every bounty it wants counted in BOUNTY.json, as a list. Places go by the
# counted entrants of the named bounties that count (a bounty counts from its first counted entrant), added bounty by
# bounty, as the house counts them in make.fun's own database at this contest's deadline, the most first; a tie goes to
# the higher pot of those bounties, then the earlier receipt. Metric (program/v1 + harness.entry_link on platform makefun
# naming `counts`, min_entrants 1, creator_share allowed), no judge. Validated by server/competitions/load.ts against
# contracts/competition.ts; seeded by `npm run db:seed`.
#
# THE OWNER'S ASK (2026-11-23, word for word, in order), on a screenshot of bounty-entrants-01's row on /admin's Escrow
# locks awaiting approval ($500, opened Nov 22, hidden until approved, the reward wallet holding 394.79 USDC, "The reward
# wallet holds less USDC than this lock"): "let's do a test version of this contest, $250 bounty, starting now, running
# for 24h"; then "yeah literally just the exact contest we have with prize amount and timing changed and for $
# distirbution, we can do like, top 50 or something". So the pot ($250), the spread over the top 50 places, the 24 hours
# of entries and the opening are the owner's; every other key, sentence, sealed tree and check is bounty-entrants-01's.
# The table is the catalogue's "$250 fifty-place table" (CATALOGUE_TABLES; gta6-cover-art-02's and
# gta6-trophy-guide-02's), so no new table. bounty-entrants-01 stays as it is (sealed and open, its lock still awaiting
# the owner): a $250 lock fits the reward wallet's 394.79 USDC alone, not beside that $500 one.
#
# OPEN AND PUBLIC ON THE OWNER'S GO (2026-11-23, word for word): "ok whatever do the new slug just be fast about it", after "great so we just need that bounty
# setup now", on the ask's "starting now". Sealed first as a hidden draft for review (status draft, visibility internal,
# on REVIEW_DRAFTS), then opened in the same chat: re-dated with scripts/redate-bundle.ts (--unescrowed: no production row
# held it) to 2026-11-23T07:30:00Z, the first whole hour or half hour the deploys of dev and production leave room for,
# 24 hours of entries to 2026-11-24T07:30:00Z, status open and visibility public, its block in production's seed
# catalogue and its OPENED_IN_TURN row, its REVIEW_DRAFTS row retired, SHIPPED_BUNDLE_SHA256 re-pinned. Seeded open, the
# fund-at-open job records its $250 escrow awaiting the owner's Approve on /admin (Escrow locks awaiting approval;
# .cosmos/rules/escrow-approval.mdc): nothing is locked without it, never by an agent, and until its lock lands the
# bounty is hidden from everyone but admins, announced nowhere and takes no entry (no unescrowed fallback). From the
# opening no byte of this directory changes (a fix is a new slug).
#
# The design below is bounty-entrants-01's, carried word for word (its header holds the history of the ask that made it,
# 2026-11-19, and its re-shape, 2026-11-21).
#
# What wins, and what it beats. The entry is bounties on make.fun itself: tasks its entrant designed, proposed, funded
# and opened, that real people paid to enter. The winner is the entrant whose bounties drew the most distinct paying
# entrants by the deadline, a measure no rubric can argue with: each one a person who found a task worth a fee. The
# public alternative is a contest a person runs by hand on another site, ranked nowhere against anyone else's; here
# every entrant's bounties are ranked on one public count, and every one grows make.fun's own catalogue of paid
# bounties. What the house checks is each bounty (the sponsor's account, its approval, its window, its fee, one account a
# bounty) and who entered it (the counted entrant, below); a bounty's task, prizes and rules are make.fun's sponsor
# flow's (its review, or for an option a suggestion marked auto_list the suggest service's content policy,
# server/proposals/auto-list.ts), never a check of this contest's.
#
# The counted entrant (server/entry-link/makefun-counts.ts bountyCountsOf; the rules' Who counts, in plain words): a
# person (accounts merged into one another fold into one) counts on its own with, in a named bounty, an entry that is no
# house entry and that the bounty did not refuse, received by the cap, and an entry fee paid by the cap. Refused, as the
# entry stands when read: failed (but for a platform fault), cancelled, nondeterministic or timeout, or a fail of
# disqualified, hindsight_clean or finalist_review; waiting, checked, graded and finished entries count. Every account is
# clustered with every other (server/payouts/clusters.ts clusterEntrants under the cluster scan's rule: a shared payout
# or linked wallet, a GitHub login held now or before, a repository owner, or a commit email beside one of those,
# directly or through other accounts), and a cluster is ONE counted entrant when it holds a person who counts on its own
# and no left-out account. Left out: the bounty's creator and accounts merged with it, accounts holding its agent
# wallets, accounts sharing an identity with it (server/referrals/signals.ts sharedIdentityOf: a payout or linked
# wallet, a GitHub login, a repository owner, a commit email), accounts sharing a network address with it in
# account_network_day within NETWORK_WINDOW_DAYS (30) of the cap (an anonymizing egress never joins), and accounts with
# a held or upheld distinct-entrant check on an entry in the bounty; a cluster holding any of them counts no entrant and
# no fee. A bounty's entry fees are the counted clusters' paid amounts (each person's who counts on its own), the whole
# of each fee, in whole cents; its pot is its reward pool as funded (competition.reward_usd) plus the stored pot part of
# every fee paid into it by the cap, whoever paid it, never make.fun's match. Counted bounty by bounty: one person in two
# of an entrant's bounties counts in each, by the plan's call (a bounty is a promo of its own and each draws its field).
#
# What a fake still costs (the run review's sybil ring, 2026-11-19, re-costed for the re-shape and stated with no
# figure: the split is the code's, server/entry-fees and contracts/entry-fee-fund.ts, and may change while these bytes
# stay sealed). A fake must hold an identity of its own (a fresh wallet, no GitHub shared, no network shared with the
# creator) and an entry its bounty took. Its fee then splits under the bounty's frozen terms (GET /api/sponsor/terms
# names the fields: limits.fee_house_percent, limits.max_creator_percent, limits.creator_cut_percent): the creator's net
# share comes back to the ring, and the pot part comes back too when nobody places (server/payouts/standings.ts refunds
# every pot share), so a fake costs the ring the part of its fee make.fun keeps for its fund (its house share and its cut
# of any creator share), which nothing refunds. Allowing a creator share (creator_share: allowed) moves none of that:
# make.fun's part is taken whatever the creator keeps. A fake also lifts the pot, the tie-break, by its fee's pot part,
# which the ring could as well fund outright as prizes: the pot ranks only a tie. The rules say plainly that fees paid by
# accounts make.fun links to the creator never count.
#
# Bought entrants (the manager's ruling on the review packet, 2026-11-19, carried from gta6-clipper-01's treatment of
# bought views, not the owner's words): paying, rewarding or refunding people to enter one's bounties outside their own
# prizes (cash, giveaways, fee refunds, a paid promotion that pays per entry) is in the rules' Disqualification, decided
# by make.fun's organisers through the disqualify act (server/entries/disqualify.ts disqualifyEntry) before the results
# post; ordinary promotion (posts, ads that pay for reach, not per entry) is fine, and the rules say so. No new automated
# check and no detector (no-unrequested-safety-checks.mdc): the counted-entrant rules above are the only automatic part.
#
# The directories:
#   competition.yaml        this file (competition.draft.yaml beside BUNDLE_PENDING until the seal, 2026-11-19).
#   scorer/score.ts         the sealed scorer (harness.gate: valid, runtime node22, standard library only), naming no slug
#                           so every make.fun bounty bundle shares its bytes, each ranking on its own column. It reads
#                           /output/BOUNTY.json, /output/bounty.counts.json and /reference/gate.json, writes exactly the
#                           five scored columns, bounties, entrants, pot_usd, entry_fees_usd and valid
#                           (grader/program-scores.ts), and checks.json rows: bounty_file (a JSON object of at most
#                           16,384 bytes naming bounties or url, not both), bounty_list (1 to 100 items, each a bounty's
#                           address on make.fun, its slug or its id, exactly as server/entry-link/makefun.ts
#                           readMakefunLinkList reads them, mirrored, a bounty named twice read once), bounty_counts (the
#                           house's counts file present and exactly contracts/entry-link-counts.ts BountiesCounts,
#                           mirrored with the standard library, naming exactly the named bounties, each item matched to a
#                           row by its slug or its id, one row read live, and on a 'deadline' reading one counting), then
#                           bounty_1 to bounty_<n>, one a named bounty, saying what it counts (at most 103 rows, under
#                           grader/program-scores.ts MAX_CHECKS 500). The five scores are bountiesTotalsOf's over the
#                           file's rows at its min_entrants (the sums in BigInt), the amounts in dollars (cents / 100),
#                           when the entry is valid, else 0. So the dev board lists an entry whose bounties have no
#                           entrant yet, and the final gives it no place.
#   reference/gate.json     the gate's limits, slug-free so every sibling shares it: format makefun/bounty-gate/v2,
#                           BOUNTY.json's byte cap (16384, makefun.ts MAKEFUN_LINK_FILE_MAX_BYTES), an item's length
#                           (2048, MAKEFUN_LINK_URL_MAX_CHARS), the most bounties a file names and a counts file holds
#                           (100, contracts/entry-link-counts.ts BOUNTIES_COUNTS_MAX) and the counts file's byte cap (65536,
#                           BOUNTIES_COUNTS_MAX_BYTES). A malformed file is the bundle's fault: the scorer exits 1.
#   starter/                a working entry laid out as an entrant's repository: main.ts copying BOUNTY.json to /output,
#                           BOUNTY.json holding the placeholder {"bounties": ["https://make.fun/bounty/<slug>"]} (no
#                           bounty's address, so the gate refuses it: a starter that passed would need no bounty), an MIT
#                           LICENSE, README.md for the person and AGENT.md for the agent; both say to start the session
#                           at or after the opening (thinking_in_window), launch one or several bounties through the
#                           sponsor flow (the proposal form, the least fee of $0.50, an option marked auto_list listing
#                           on payment and any other reviewed first, the window each must open in, the limits by field),
#                           write BOUNTY.json, check and submit, add a bounty by submitting the whole list again, what
#                           counts and who counts, and that `makefun grade-local` reads invalid with no house counts.
#
# The harness: program/v1, one node22 runtime, the bundle's own data (input_data null), the sealed scorer above, and
# harness.entry_link {file: BOUNTY.json, platform: makefun, counts: bounty.counts.json, min_entry_fee_usd: 0.5,
# min_entrants: 1, creator_share: allowed} (contracts/competition.ts ProgramEntryLink, platform makefun;
# server/entry-link/makefun.ts). The house reads BOUNTY.json from the entry's snapshot at intake (readMakefunLinkList),
# looks every named bounty up in make.fun's own database (lookUpMakefunBounties: one read of the competition rows the
# items name joined to their sponsors, one recursive read of the merge chains of the entrant and every creator) and
# refuses the entry when any of them fails (makefunListVerdict, the first that fails named with its place in the list),
# in order: a bad file or item; no bounty of that slug or id; this contest's own slug; a bounty that is no sponsor's; a
# sponsor account neither the entrant's nor merged with it; a draft or internal bounty (not approved yet: the same
# commit submitted again once it is approved mends it); a cancelled one; one opening outside [opens_at, deadline]; no
# entry fee above 0; a fee under $0.50; and an earlier entry of another account naming any of the same slugs (one
# account a bounty, always). A creator share is no reason (creator_share: allowed skips check 10: the pass says the share
# the creator keeps). Nothing else is checked: not a bounty's task, prizes, rules or board (the plan's scope,
# ~/.cosmos/rules/no-unrequested-safety-checks.mdc). After the entry's two runs and before the scorer the grader writes the
# house's counts at /output/bounty.counts.json (grader/program.ts houseCountsOutputs, makefun/bounty-counts/v2, a row
# each named bounty by slug ascending, the record's min_entrants), replacing what the entry wrote there: a dev grade the
# reading the intake check took (reading 'check'), a final grade the reading the final's lock took (reading 'deadline').
# The program's own output never reaches the score, so main.ts is a copy of BOUNTY.json and no more. `makefun
# grade-local` writes no house counts, so a local grade reads invalid: the comp test proves the scorer by grading as the
# grader grades (houseCountsOutputs from a makefun record), and proves it equal to bountiesTotalsOf on fixtures.
#
# The counts. Three readings, each on the entry's record over every bounty it names (server/entry-link/makefun-readings.ts,
# readings.{intake,latest,deadline}, a row each bounty under its slug): the intake check's (the dev grade's counts file,
# counted up to the read); the latest, which the 15-minute sweep (server/grading/provisional-rejudge-sweep.ts
# readMakefunLatest) takes again for each read entry while the dev window is open, once its last is
# MAKEFUN_LATEST_MIN_INTERVAL_MS (5 minutes) old, at most MAKEFUN_LATEST_PASS_MAX (500) entries a pass, the oldest
# first, and the dev board ranks on with no regrade (server/routes/competitions/leaderboard.ts withLatestBountyCounts:
# its totals, a gate-invalid entry keeping its 0); and the lock's, one batched pass over every frozen final entry's
# bounties inside lockPhase (server/competitions/lifecycle/finalize.ts), counted up to THIS contest's deadline whenever
# it is read (an entrant or a fee after it never counts), before any final grade is sent, which the final grade's
# counts file carries. A final grade whose reading is not yet in (a faulted pass, a late joiner) waits for it inside the
# final window (grader/worker.ts countsHandOn), never graded on another, and the sweep reads what is owed
# (readMakefunCountsOwed). A bounty cancelled, internal or no longer found when read reads `bounty: 'gone'` and counts
# nothing; an entry none of whose bounties reads live, or at the lock none counting, is invalid and takes no place. A
# record holding no reading is HouseCountsFault, the house's, never scored as the entrant's. The dev board is a live,
# unofficial projection; the places are the lock's reading alone. The reads are make.fun's own database: no outside
# quota and no outside key.
#
# The leaderboard: entrants at index 0 (desc, precision 0, primary: a whole count shown exact, owed its
# EXACT_RANK_COLUMNS row in tests/unit/catalogue.test.ts), pot_usd at index 1 (desc, precision 2, unit usd, so every
# reader shows it as money, '$50.00': the tie_break_index, a different count than the rank, contest-design.mdc:14),
# bounties at index 2 (desc, precision 0), entry_fees_usd at index 3 (desc, precision 2, unit usd) and valid at index 4
# (desc), all five scored, no source column and no feed. An exact tie on the entrants goes to the higher pot, then the
# earlier receipt: resolution.tie_break and the rules' Ranking carry server/routes/competitions/tie-break.ts
# tieBreakText's sentence word for word ("exact ties on the rank key entrants go to the higher Pot (pot_usd), then the
# earlier receipt"), and the kit's makefun block (server/routes/competitions/kit.ts makefunBountyFirstLine) keys its
# ranking sentence off the rank column entrants and its tie off pot_usd.
#
# The money (the owner's: "$250 bounty", "top 50 or something"): the catalogue's $250 fifty-place table
# (CATALOGUE_TABLES, "the $250 fifty-place table"), $50 / $30 / $15, $5 each for 4th to 10th and $3 each for 11th to
# 50th, each place its own row, exactly $250. In place of bounty-entrants-01's release's twenty-place table ($100 / $70 /
# $50, $20 each for 4th to 10th and $14 each for 11th to 20th, $500). house_holds_places: true with the rules' sentence;
# no house entry, no house.yaml, no baseline, and no entry fee of its own (the least fee is the entrants' bounties',
# never this contest's).
#
# The dates (the owner's: "starting now, running for 24h"): opened at 2026-11-23T07:30:00Z, the first half hour the deploys
# of dev and production leave room for, the opening and dev's start, no other opening or deadline within 30 minutes of it (OPENED_IN_TURN's
# stagger); the deadline and dev's end 2026-11-24T07:30:00Z, exactly 24 hours of entries. The final from the deadline itself (server/competitions/final-start-floor.ts:
# an undrawn escrowable final starts at the deadline, no gap) to 6 hours after it, bounty-entrants-01's length. The copy
# quotes no date and no window length: the page prints them. One day is short for this contest: an option a suggestion
# marks auto_list, drafted and changed only where it may be, lists once its deposit lands and opens minutes later
# (limits.auto_list_lead_minutes), while any other proposal waits MAKEFUN_SPONSOR_REVIEW_HOURS (12 by default) after its
# checks, so it opens with half the window gone, and a custom brief (72 hours more for its setup) cannot count at all. The
# rules say each case already, in bounty-entrants-01's words ("This bounty's window is short, ..."). The preflight's
# makefun-entry-link asks a window of at least the review plus 24 hours, 36: this draft's 24 hours fail that one line,
# the owner's window, and every other line of it passes. Hence the total cap of 10: 5 a day, as bounty-entrants-01's,
# over the two UTC days the 24 hours touch, each added bounty being a submission of the whole list again. How long the
# last final of its kind took: no make.fun bounty entry has run a final; the last metric program/v1 entry-link final that
# has, makefun-coin-launch-01's (221 submissions, every entry run twice and gated, no judge), took 52 minutes from its
# deadline; the rules quote it.
#
# The automation: {lifecycle: true, payouts: auto, escrow: at_open}, inert while a draft: once open, at the deadline the
# lifecycle job locks the final (the counts read in that lock), grades every final entry and resolves the results; the
# escrow funded at open, once the owner approves its lock, pays the placements, and payouts auto pays from the reward
# wallet only when that escrow was never funded. The payout lines are the btc-race release template's two-case words
# (ESCROW_AT_OPEN_SAYS), naming no challenge window.
#
# The budget, as priced by `node scripts/new-bounty-preflight.ts bounty-entrants-02` on this draft (2026-11-23): at 2,000
# entries the final 0.93 h expected and 1.85 h at worst against the 2- and 4-hour ceiling, and past its scoring pass 0 h
# at 10,000 entries (a program/v1 final grades each entry once and runs no heat after it); practice 0.08 days of its lane
# a day; the same figures as bounty-entrants-01's, since the places and the window move no grade. No judge: no judge
# call, no token price, no spend cap (.cosmos/rules/grading.mdc), and the rules name none. Both sealed trees are
# bounty-entrants-01's byte for byte (scorer e9f747d74a66…, reference ea7310450b11…), and the bundle's sha256 is the
# figure tests/unit/contracts-practice-windows.test.ts SHIPPED_BUNDLE_SHA256 pins.
#
# The grading load (new-bounty SKILL.md section 5's gate), at the expected field and 10 times it. The field: an entry
# here costs its entrant at least one funded bounty of its own and up to half a day of review (none for an option marked
# auto_list, which opens under an hour and a half after its checks; three and a half days for a custom brief), so it is
# expected far below the budget's 2,000 (outside-account bounties drew 221 to 2,473 entries); the lines below are read
# at 2,000 and 20,000 all the same.
# Per-entry events: a submission writes one entry (O(1)); the entry-link stage reads its own snapshot's BOUNTY.json,
# makes one read of the named bounties' competition rows and sponsors and one recursive read of the merge chains (O(the
# named bounties), at most 100), takes the intake reading (server/entry-link/makefun-counts.ts readBountyCounts over the
# named bounties: their own entries and payments, by submission_competition_idx and
# entry_fee_payment_competition_user_status_idx, O(those bounties' entrants), never this contest's field), stores its own
# record, and makes one read for one_account (server/entry-link/stage.ts earlierAccountHoldsMakefunBounty over
# server/entry-link/link.ts makefunBountiesWhere(slugs): keyed on the competition, the record's slugs list matched with
# `?|`, partial on the platform literal). The list's own index (a partial GIN index on entry_link -> 'slugs' where
# entry_link ->> 'platform' = 'makefun', the plan's step 6) is not in this tree: it lands as its own migration,
# hand-built CONCURRENTLY on production's primary at the go-live's deploy before the migration's row is recorded, as
# db-migrations.mdc asks of an index on write-hot submission. Until then the list read filters the competition's
# make.fun rows through the one-bounty index, migration 0280 (submission_makefun_bounty_idx, on (competition_id,
# entry_link ->> 'slug') where entry_link ->> 'platform' = 'makefun'), competition_id its key and the slugs a filter
# over those rows: O(n) an entry over this contest's own entries, which is small while these contests are new. With its
# own index the read is answered from the few rows the slugs match, competition_id a filter over them: O(1) an entry,
# where a filter on the competition's rows alone is O(n), the shape gta6-clipper-01's rig measured at 2,000 entries as a
# Seq Scan of 2,000 rows, 11.5 ms and 15.8% of the wave's database time before its partial index. 0280's index stays
# until a later release drops it, once the list's own has landed. At this go-live the list's own index had not landed,
# so this contest's one_account read runs on 0280's, O(n) an entry over its own entries.
# A transcript ingest reads the final's set through entriesToGradeLean once; a grade reads its own run and its own record
# (houseCountsOutputs builds the counts file from the entry's record alone) and sends its phase's followers only when
# none is queued (queuedFollowerOf); a final grade whose lock reading is not in yet is sent again 60 s on
# (grader/worker.ts countsHandOn, COUNTS_GRADE_RESEND_MS) before it starts a pod. The paths that read the field, each
# once a pass and never per event: the lock's pass (readMakefunCountsAtLock, once a lock: chunks of
# MAKEFUN_READINGS_CHUNK (500) entries, one readBountyCounts call and one UPDATE in one short transaction a chunk, begun
# inside MAKEFUN_LOCK_PASS_BUDGET_MS, 5 minutes), the 15-minute sweep's owed and latest passes (makefunCountsDue,
# readMakefunLatest: at most 5,000 and 500 entries a pass, begun inside MAKEFUN_SWEEP_PASS_BUDGET_MS, 90 s), and the dev
# board's overlay (withLatestBountyCounts) reading the latest reading off the candidate row it already reads. An entry's
# reading reads every bounty it names, so a pass reads up to 100 bounties an entry: bounded by the format, and each
# bounty's read keyed on its own competition.
# The pod figures (the preflight, its default live load: --live-pods and --s18-pods not read from production for this
# draft): the split layout, a grade 3 pods one after the other (2 executions x 1 run + 1 scorer); 48 sandbox pods at
# once on s9 at 2,000 entries (6,000 made over the final) and at 20,000 (60,000 made), 80 pod-seconds an entry; s9 holds
# 250 beside the live contests' 48. These are new harness paths (the makefun intake check over a list, the counted
# entrants, the v2 counts file, the latest sweep and the lock's batched reading over every named bounty), so the e2e rig
# proof (reference.md, "Prove it on the e2e rig") is OWED before the go-live and was NOT run for this draft: the rig's
# make.fun wave of several hosted bounties an entry is the plan's step 18, a separate item's. bounty-entrants-01 opened
# without it on the owner's go, and this test version, the same harness and the same sealed trees, opens the same way:
# the review packet names the gap. The field one day and $250 draw is expected far under the 2,000 the budget prices.
#
# The rules quote today's Transcript gate lines (server/entries/policy.ts thinkingPolicyLines for this slug, program/v1
# and authorship 12, printed 2026-11-23: eleven checks; thinking_own_work carries the 23 November sentence on a program
# read from an environment secret, which bounty-entrants-01's sealed rules predate), the eligibility paragraph
# word for word, the house-holds sentence and the repository line (scripts/new-bounty-preflight.ts REPOSITORY_LINE: the
# repository and commit never public). The Transcripts section carries no "They are never published, ..." sentence
# (new-bounty section 2). The board copy (title, summary, demand) stays off OFF_BOARD
# (server/competitions/board-words.ts). No copy states an entry-fee split as a percent or a money figure (the
# preflight's makefun-entry-link): the rules name the sponsor terms' fields and point to GET /api/sponsor/terms. What is
# public: each bounty is public on make.fun once approved (its own page), this contest's board shows each entry's totals,
# and the entry's page shows each named bounty by its title, linked to its page (server/routes/archive/judge.ts
# publicLinkShows); the repository and commit are never shown. The copy names no right over the entrant's bounties
# (no-unsolicited-legal.mdc).
version: 1

competition:
  slug: bounty-entrants-02
  title: Get the most paying entrants across the bounties you launch on make.fun
  summary: "Launch one or several bounties of your own on make.fun, each with an entry fee of at least $0.50, then bring people in to enter them; places go by the counted paying entrants of your bounties that count at the deadline, and the top 50 share $250."
  demand: "make.fun itself, which wants more bounties people pay to enter, and the builders who want an agent that can design, launch and fill contests of their own."
  category: Growth
  skills: [Marketing, Community, Bounty design]
  status: open
  visibility: public
  sponsor: make-fun
  reward_usd: 250
  opens_at: "2026-11-23T07:30:00Z"
  deadline: "2026-11-24T07:30:00Z"
  prerequisites:
    as_of: "2026-11-23"
    label: Needs USDC for its prizes
    summary: Node.js 22.18 or later, and a Solana wallet linked to your make.fun account holding the USDC for your own bounties' prizes and a little SOL for their fees.
    software:
      - id: node
        name: Node.js 22.18 or later
        required: true
        platforms: [darwin, win32, linux]
        version: 22.18 or later
        url: https://nodejs.org/en/download
        why: Your main.ts runs on Node 22 (the bounty's node22 runtime) and you run it yourself to write /output; the kit's CLI, which checks and enters the entry, runs on Node too.
        how_to_check: The node executable on your PATH reports version 22.18 or later; a newer major release, such as 24 or 26, counts.
        fix: Install Node.js 22.18 or later (a newer release such as 24 or 26 works as well) from nodejs.org or with a version manager (nvm, fnm or Volta), and put it on your PATH.
        tell_person: This bounty needs Node.js 22.18 or later on this computer; a newer release such as Node.js 24 or 26 is fine. Please install one from https://nodejs.org.
