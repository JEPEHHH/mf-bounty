        tell_person: This bounty's entry is one or several bounties of your own on make.fun, each with an entry fee of at least $0.50, whose prizes you fund in USDC on Solana. Please link a Solana wallet holding that USDC (and a little SOL) to your make.fun account and sign each deposit when I hand it to you; never give me its key or seed phrase.
